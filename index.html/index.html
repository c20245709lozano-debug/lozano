<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kim Lozano | Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Kim Lozano</h1> 
        <nav>
            <span>
                @kcly.ism_
            </span>
            <ul>
                <li><a href="#about">About</a></li>
                <li><a href="#services">Services</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="about">
            <h2 class="about"> About me</h2>
            <p class="about-me">
                HELLLO HELLO HELLO HELLO
            </p>
        </section>

        <section id="services">
            <h2 class="services">My Services</h2>
            <p class="services-me">HUG, KISS, CUDDLE</p>
        </section>
      
        <section id="contact">
            <h2 class="contact">Contact me</h2>
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>
        
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="allow" name="allowed" required>
                    <label for="allow">Allow data processing</label>
                </div>

                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>

</body>
</html>
